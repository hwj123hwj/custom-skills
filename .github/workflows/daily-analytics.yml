name: Daily Analytics Report

on:
  schedule:
    # 每天 UTC 01:00 = 北京时间 09:00 推送昨日数据
    - cron: '0 1 * * *'
  workflow_dispatch: # 支持手动触发测试

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd scripts/analytics
          npm install googleapis google-auth-library

      - name: Run GA4 Analytics Report
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_CREDENTIALS: ${{ secrets.GA4_CREDENTIALS }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: node scripts/analytics/ga4-to-feishu.mjs

      - name: Push URLs to Baidu
        env:
          BAIDU_API_URL: ${{ secrets.BAIDU_API_URL }}
        run: |
          cd web && npm install && npm run build && node ../scripts/analytics/push-to-baidu.mjs
